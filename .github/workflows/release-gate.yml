name: Release gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  catalog-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out real Hermes loaders (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: bd3cbe91a90097f9804f16ea5c1768f5cbaaf0b7
          path: .hermes-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install discovery-test dependencies (not the Hermes runtime)
        run: python -m pip install pytest==8.4.2 PyYAML==6.0.3 python-dotenv==1.2.4 ruamel.yaml==0.19.1
      - name: Test catalog directory discovery and loading
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.hermes-source
        run: python -m pytest tests/test_catalog_discovery.py -q

  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install release-gate tooling
        run: python -m pip install build==1.6.1 pytest==8.4.2 ruff==0.16.8
      - name: Install package under test
        run: python -m pip install .
      - name: Test
        run: python -m pytest tests -q
      - name: Lint
        run: python -m ruff check __init__.py nachos_core nachos_hermes tests
      - name: Build wheel
        run: python -m build
      - name: Verify wheel entry points
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python -c "import importlib.metadata as m; memory = next(x for x in m.entry_points(group='hermes_agent.memory_providers') if x.name == 'nachos'); context = next(x for x in m.entry_points(group='hermes_agent.plugins') if x.name == 'nachos-context'); assert callable(memory.load()); assert callable(getattr(context.load(), 'register', None))"
